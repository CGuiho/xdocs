schema: 1
extensions:
  supported:
    - .xdocs.md
ai:
  mode: auto
ignore:
  gitignore: true
  rules:
    - pattern: AGENTS.md
      kind: file
      frontmatter: false
    - pattern: README.md
      kind: file
      frontmatter: false
    - pattern: CLAUDE.md
      kind: file
      frontmatter: false
scan:
  exclude:
    - node_modules
    - .git
    - dist
    - build
    - library
    - bin
    - bundle
    - vendor
    - .temp
    - .tmp
    - .tmp-home
    - .tmp-opencode
    - _opencode_workspace
project:
  name: xdocs
